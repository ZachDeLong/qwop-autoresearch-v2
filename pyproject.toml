[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qwop-lab"
version = "0.1.0"
description = "Reproducible QWOP evaluation, verified video replay, and bounded RL experiments"
requires-python = ">=3.12,<3.13"
dependencies = [
  "qwop-gym==1.0.1",
  "gymnasium==0.29.1",
  "numpy==1.26.4",
  "torch==2.8.0",
  "stable-baselines3==2.9.0",
  "sb3-contrib==2.9.0",
  "selenium==4.35.0",
  "websockets==11.0.3",
  "pillow==10.4.0",
  "pygame==2.6.1",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.12.12"]
report = ["matplotlib==3.11.2"]

[project.scripts]
qwop-lab = "qwop_lab.cli:main"

[tool.setuptools.packages.find]
include = ["qwop_lab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
